# COGITO web app on Netlify. Deploy the pre-built dist/ folder:
#   npm run build && npx netlify-cli deploy --prod --dir dist --no-build --site <site-id>
[build]
  command = "npm run build"
  publish = "dist"

# The service worker and manifest must never be cached by the CDN/browser, or updates would not reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hashed build assets never change, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
