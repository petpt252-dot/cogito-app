<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orb" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#C9B2FF"/>
      <stop offset="0.45" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#1D3FBF"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DA9FF"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="#090B16"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="178" fill="url(#orb)"/>
  <!-- neural "C": an open arc with nodes, linked to a central node -->
  <g filter="url(#glow)" stroke="#fff" stroke-linecap="round" fill="none">
    <path d="M338 168 A118 118 0 1 0 338 344" stroke-width="26"/>
    <path d="M256 256 L176 190 M256 256 L150 268 M256 256 L190 336" stroke-width="9" opacity="0.85"/>
  </g>
  <g fill="#fff" filter="url(#glow)">
    <circle cx="338" cy="168" r="20"/>
    <circle cx="338" cy="344" r="20"/>
    <circle cx="176" cy="190" r="14"/>
    <circle cx="150" cy="268" r="14"/>
    <circle cx="190" cy="336" r="14"/>
    <circle cx="256" cy="256" r="24" fill="#BFE3FF"/>
  </g>
  <!-- glossy highlight (2010 style) -->
  <ellipse cx="256" cy="158" rx="140" ry="78" fill="url(#gloss)" opacity="0.55"/>
</svg>
